name: Lights Out CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lights-out-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

defaults:
  run:
    working-directory: electron

jobs:
  verify:
    name: Lint & Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.1'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check supported Node
        run: npm run check-node
      - name: Audit runtime dependencies
        run: npm audit --omit=dev
      - name: Verify release notes file exists for current version
        run: |
          version=$(node -p "require('./package.json').version")
          test -f "../docs/RELEASE_NOTES_${version}.md"
      - name: Lint
        run: npm run lint
      - name: Syntax check
        run: |
          for f in *.js scripts/*.js; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Smoke tests
        run: npm run smoke

  android:
    name: Android debug qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: companion-android
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.qa/android
      GRADLE_USER_HOME: ${{ github.workspace }}/.qa/gradle
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify credential-free debug workspace
        run: |
          test ! -f keystore.properties
          chmod +x gradlew
      - name: Unit tests, lint and isolated debug APK
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Save Android qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lights-out-android-debug-qa
          path: |
            companion-android/app/build/reports/tests/testDebugUnitTest/
            companion-android/app/build/reports/lint-results-debug.*
            companion-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  build:
    name: Package (Windows)
    needs: verify
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.1'
      - name: Match build npm version
        run: npm install --global npm@11.12.1
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Provision and verify locked Electron
        run: |
          npm run electron:provision
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run electron:verify
      - name: Read release version
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Provision pinned NSIS
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/provision-nsis.ps1
      - name: Unit tests on Windows
        run: npm test
      - name: Window geometry runtime test
        run: npm run test:geometry
      - name: Build installer and portable ZIP
        run: npm run build
      - name: Unattended packaged and Night Modes qualification
        run: node scripts/e2e-runner.js --ci
      - name: Verify installer, portable contents and checksums
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-windows-release.ps1
      - name: Verify clean release provenance
        run: node scripts/release-artifacts.js verify ../dist-native --release
      - name: Upload verified artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lights-out-windows
          path: |
            dist-native/Lights-Out-Portable-*.zip
            dist-native/Lights-Out-Setup-v*.exe
            dist-native/SHA256SUMS.txt
            dist-native/BUILD-MANIFEST.json
            dist-native/WINDOWS-VERIFICATION.json
          if-no-files-found: error

  release:
    name: Publish verified release
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v') && github.ref == format('refs/tags/v{0}', needs.build.outputs.version)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lights-out-windows
          path: dist-native
      - name: Independently verify downloaded asset hashes and source pin
        run: node scripts/release-artifacts.js verify ../dist-native --release-assets
      - name: Verify published checksum file
        working-directory: dist-native
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish qualified Windows artifacts
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Lights Out v${{ needs.build.outputs.version }}
          make_latest: true
          overwrite_files: false
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES_${{ needs.build.outputs.version }}.md
          files: |
            dist-native/Lights-Out-Portable-*.zip
            dist-native/Lights-Out-Setup-v*.exe
            dist-native/SHA256SUMS.txt
            dist-native/BUILD-MANIFEST.json
            dist-native/WINDOWS-VERIFICATION.json
