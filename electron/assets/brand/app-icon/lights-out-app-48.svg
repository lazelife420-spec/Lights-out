<?xml version="1.0" encoding="UTF-8"?>
<!-- Lights Out app icon, 48px master: the lit teal desk lamp on the night badge.
     Drawn on its own 48px grid (coordinates snapped to whole/half pixels) so the
     48px Windows icon frame is drawn rather than shrunk. Rendered into assets/icon.ico
     by scripts/make-icons.js. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="bg" cx="0.42" cy="0.3" r="0.95"><stop offset="0" stop-color="#132634"/><stop offset="0.6" stop-color="#0a131c"/><stop offset="1" stop-color="#05080f"/></radialGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#00FFD1" stop-opacity="0.8"/><stop offset="0.55" stop-color="#00FFD1" stop-opacity="0.25"/><stop offset="1" stop-color="#00FFD1" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#00FFD1" stop-opacity="0.5"/><stop offset="1" stop-color="#00FFD1" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="46" height="46" rx="10" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="45" height="45" rx="9.5" fill="none" stroke="#00FFD1" stroke-opacity="0.2" stroke-width="1"/>
  <ellipse cx="32.5" cy="38.5" rx="13" ry="4" fill="url(#pool)"/>
  <polygon points="29.5,25 40,20.5 43.5,38.5 22,38.5" fill="url(#beam)" opacity="0.75"/>
  <rect x="8" y="37" width="14" height="4" rx="0.5" fill="#1fbfa8"/>
  <polyline points="15.5,37 20.5,23.5 27.5,13.5" fill="none" stroke="#178f80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="20.5" cy="23.5" r="2.03" fill="#1fbfa8"/>
  <polygon points="24.5,12 31.5,7 41,20.5 29.5,25.5" fill="#00FFD1"/>
  <line x1="29.5" y1="25.5" x2="41" y2="20.5" stroke="#64FFF0" stroke-width="2" stroke-linecap="round"/>
</svg>
