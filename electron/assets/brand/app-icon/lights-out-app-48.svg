<?xml version="1.0" encoding="UTF-8"?>
<!-- Lights Out app icon, 48px master: the night badge and the logo's broken O with
     its flicker particle. Drawn on its own 48px grid so the
     48px Windows icon frame is drawn rather than shrunk. Generated; rendered into
     assets/icon.ico by scripts/make-icons.js. -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <radialGradient id="bg" cx="0.6" cy="0.58" r="0.85"><stop offset="0" stop-color="#0f2430"/><stop offset="0.5" stop-color="#0a141d"/><stop offset="1" stop-color="#04070c"/></radialGradient>
    <linearGradient id="ring" x1="0.15" y1="0.05" x2="0.85" y2="0.95"><stop offset="0" stop-color="#8AFFF4"/><stop offset="0.5" stop-color="#19F2CF"/><stop offset="1" stop-color="#00C2A4"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="48" height="48" rx="10.5" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="10" fill="none" stroke="#7DFFF2" stroke-opacity="0.28" stroke-width="1"/>
  <circle cx="24" cy="25" r="15" fill="none" stroke="#00FFD1" stroke-opacity="0.22" stroke-width="12"/>
  <circle cx="24" cy="25" r="15" fill="none" stroke="url(#ring)" stroke-width="6" stroke-linecap="butt"
          pathLength="100" stroke-dasharray="31 6 36 6 15 6" stroke-dashoffset="-2" transform="rotate(-62 24 25)"/>
  <rect x="37.76" y="6.74" width="4.5" height="4.5" fill="#9BFFF4" transform="rotate(45 40.01 8.99)"/>
</svg>
