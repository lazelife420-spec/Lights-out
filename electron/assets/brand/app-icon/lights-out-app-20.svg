<?xml version="1.0" encoding="UTF-8"?>
<!-- Lights Out app icon, 20px master: the lit teal desk lamp on the night badge.
     Drawn on its own 20px grid (coordinates snapped to whole/half pixels) so the
     20px Windows icon frame is drawn rather than shrunk. Rendered into assets/icon.ico
     by scripts/make-icons.js. -->
<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <defs>
    <radialGradient id="bg" cx="0.42" cy="0.3" r="0.95"><stop offset="0" stop-color="#132634"/><stop offset="0.6" stop-color="#0a131c"/><stop offset="1" stop-color="#05080f"/></radialGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#00FFD1" stop-opacity="0.7"/><stop offset="0.55" stop-color="#00FFD1" stop-opacity="0.25"/><stop offset="1" stop-color="#00FFD1" stop-opacity="0"/></radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#00FFD1" stop-opacity="0.5"/><stop offset="1" stop-color="#00FFD1" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="20" height="20" rx="4" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="19" height="19" rx="3.5" fill="none" stroke="#00FFD1" stroke-opacity="0.3" stroke-width="1"/>
  <ellipse cx="13.5" cy="16" rx="5.5" ry="1.5" fill="url(#pool)"/>
  <polygon points="12,10.5 16.5,8.5 18,16 9,16" fill="url(#beam)" opacity="0.6"/>
  <rect x="3" y="15" width="6" height="2" rx="0" fill="#1fbfa8"/>
  <polyline points="6.5,15 8.5,9.5 11.5,5.5" fill="none" stroke="#178f80" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
  <polygon points="10,5 13,3 17,8.5 12,10.5" fill="#00FFD1"/>
  <line x1="12" y1="10.5" x2="17" y2="8.5" stroke="#64FFF0" stroke-width="1" stroke-linecap="round"/>
</svg>
