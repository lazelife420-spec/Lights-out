<?xml version="1.0" encoding="UTF-8"?>
<!-- Lights Out app icon, 256px master (64px and up): the night badge, the dark desk
     lamp leaning in, and the logo's broken "O" lit in teal with its flicker particle.
     The same O drawn on the Tonight dial and in the wordmark. Rendered into
     assets/icon.ico and the app PNGs by scripts/make-icons.js. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="0.62" cy="0.56" r="0.8">
      <stop offset="0" stop-color="#0f2430"/>
      <stop offset="0.45" stop-color="#0a141d"/>
      <stop offset="1" stop-color="#04070c"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00FFD1" stop-opacity="0.28"/>
      <stop offset="0.55" stop-color="#00FFD1" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00FFD1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.15" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#7DFFF2"/>
      <stop offset="0.45" stop-color="#19F2CF"/>
      <stop offset="1" stop-color="#00B89C"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#9BFFF4" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#00FFD1" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#00FFD1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4654"/>
      <stop offset="1" stop-color="#161c25"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Night badge -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="53.25" fill="none" stroke="#7DFFF2" stroke-opacity="0.16" stroke-width="1.5"/>

  <!-- The light the lamp casts: a halo inside the O and a beam into it -->
  <circle cx="146" cy="144" r="92" fill="url(#halo)"/>
  <polygon points="108,92 136,80 190,176 118,196" fill="url(#beam)"/>

  <!-- The broken O: three gaps, as in the wordmark and on the dial -->
  <circle cx="146" cy="144" r="64" fill="none" stroke="url(#ring)" stroke-width="15" stroke-linecap="butt"
          pathLength="100" stroke-dasharray="31 5 36 5 17 6" stroke-dashoffset="-2"
          transform="rotate(-62 146 144)" filter="url(#glow)"/>

  <!-- Lamp: dark metal, leaning in over the O, its rim lit -->
  <g filter="url(#soft)">
    <rect x="34" y="208" width="58" height="12" rx="3" fill="url(#metal)"/>
    <path d="M63 210 L84 146 L104 100" fill="none" stroke="#1a212b" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M63 210 L84 146 L104 100" fill="none" stroke="#3a4654" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="84" cy="146" r="8" fill="#1a212b" stroke="#4a5868" stroke-width="2.5"/>
    <polygon points="92,72 124,60 144,104 108,118" fill="url(#metal)" stroke="#0b0f15" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="98,76 120,68 134,100 110,108" fill="#4a5868" opacity="0.55"/>
  </g>
  <line x1="108" y1="118" x2="144" y2="104" stroke="#BFFFF8" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Flicker particle at the O's top gap -->
  <rect x="196" y="86" width="11" height="11" rx="1.5" fill="#7DFFF2" transform="rotate(45 201.5 91.5)" filter="url(#glow)"/>
</svg>
