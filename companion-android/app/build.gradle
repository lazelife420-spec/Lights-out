plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing is configured from keystore.properties (gitignored), Gradle properties,
// or environment variables. Release builds FAIL CLOSED if signing configuration is missing.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def getReleaseProp = { propName, envName ->
    if (keystoreProps.containsKey(propName) && keystoreProps.getProperty(propName)?.trim()) {
        return keystoreProps.getProperty(propName).trim()
    }
    if (project.hasProperty(propName) && project.property(propName)?.toString()?.trim()) {
        return project.property(propName).toString().trim()
    }
    if (System.getenv(envName)?.trim()) {
        return System.getenv(envName).trim()
    }
    return null
}

def relStoreFile = getReleaseProp('storeFile', 'LIGHTSOUT_STORE_FILE')
def relStorePass = getReleaseProp('storePassword', 'LIGHTSOUT_STORE_PASSWORD')
def relKeyAlias  = getReleaseProp('keyAlias', 'LIGHTSOUT_KEY_ALIAS')
def relKeyPass   = getReleaseProp('keyPassword', 'LIGHTSOUT_KEY_PASSWORD')

def hasReleaseSigning = relStoreFile && relStorePass && relKeyAlias && relKeyPass

android {
    namespace 'com.lightsout.companion'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lightsout.companion'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '11.2.0'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(relStoreFile)
                storePassword relStorePass
                keyAlias relKeyAlias
                keyPassword relKeyPass
            }
        }
    }

    buildTypes {
        debug {
            // Keep local proof builds installable beside the production-signed
            // companion. This avoids touching the irreplaceable release key or
            // wiping the user's saved production pairing during device tests.
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.webkit:webkit:1.11.0'

    // QR pairing: CameraX preview/analysis + on-device (bundled) barcode model.
    def cameraxVersion = '1.3.4'
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    testImplementation 'junit:junit:4.13.2'
}

gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.hasTask(":app:assembleRelease") || taskGraph.hasTask(":app:packageRelease") || taskGraph.hasTask(":app:bundleRelease")) {
        if (!hasReleaseSigning) {
            throw new GradleException("Release build failed: Authorized release signing configuration is required (storeFile, storePassword, keyAlias, keyPassword). See companion-android/README.md.")
        }
    }
}
